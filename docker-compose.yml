services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped


  backend:
    build: ./nexus-backend
    environment:
      DATABASE_URL: postgresql://nexus:nexus@db:5432/nexus
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./nexus-backend/app:/app/app
      - ./nexus-backend/alembic:/app/alembic
      - ./nexus-backend/alembic.ini:/app/alembic.ini
      - ${STORAGE_PATH:-./nexus-backend/storage}:/data/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./nexus-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    
volumes:
  pgdata:
